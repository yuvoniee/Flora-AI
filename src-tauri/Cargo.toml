[package]
name = "flora"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.2"

# §11: SQLCipher preferred. Use "bundled-sqlcipher-vendored-openssl" when
# Perl is available on the build machine (needed to compile OpenSSL).
# Fallback: plain SQLite + OS full-disk encryption (BitLocker / FileVault)
# as the SRS §11 documented minimum.  Switching is a one-line feature change
# here — memory.rs handles both via #[cfg(feature = "sqlcipher")].
rusqlite = { version = "0.35", features = ["bundled"] }


