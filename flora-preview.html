<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flora — Module A Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0f0c;
    --bg-panel:#101a14;
    --glass-edge:rgba(237,231,218,0.10);
    --glass-hi:rgba(255,255,255,0.06);
    --cream:#ede7da;
    --cream-dim:rgba(237,231,218,0.55);
    --cream-faint:rgba(237,231,218,0.30);

    --c-idle:#7fcb9a;
    --c-greeting:#8fe3c7;
    --c-focused:#e8b84b;
    --c-celebrating:#f4886b;
    --c-sleepy:#9c8fc9;
    --c-thinking:#7ed4e0;
    --c-offline:#5b6660;

    --accent: var(--c-idle);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(ellipse 900px 600px at 50% 20%, #0d1610 0%, var(--bg-deep) 60%);
    font-family:'IBM Plex Mono', monospace;
    color:var(--cream);
    padding:40px 20px;
  }

  .stage{
    width:100%;
    max-width:380px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
  }

  /* ---------- eyebrow ---------- */
  .eyebrow{
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--cream-faint);
    text-align:center;
  }
  .eyebrow b{color:var(--cream-dim); font-weight:500;}

  /* ---------- the jar ---------- */
  .jar-wrap{
    position:relative;
    width:260px;
    height:300px;
  }

  .halo{
    position:absolute;
    inset:-40px;
    border-radius:50%;
    background:radial-gradient(circle, var(--accent) 0%, transparent 68%);
    opacity:0.28;
    filter:blur(18px);
    transition:background 700ms ease, opacity 700ms ease;
    animation:halo-breathe 4.2s ease-in-out infinite;
  }
  @keyframes halo-breathe{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
  }

  .jar{
    position:relative;
    width:100%;
    height:100%;
    border-radius:130px 130px 46px 46px;
    background:linear-gradient(180deg, rgba(237,231,218,0.05) 0%, rgba(237,231,218,0.02) 40%, rgba(0,0,0,0.15) 100%);
    border:1px solid var(--glass-edge);
    box-shadow:
      inset 0 1px 0 var(--glass-hi),
      inset 0 -18px 40px rgba(0,0,0,0.35),
      0 30px 60px -20px rgba(0,0,0,0.6);
    overflow:hidden;
    backdrop-filter:blur(1px);
    transition:opacity 600ms ease, filter 600ms ease;
  }
  .jar.is-offline{ filter:saturate(0.25) brightness(0.75); }

  .jar-rim{
    position:absolute;
    top:0; left:14%;
    width:72%;
    height:14px;
    border-radius:0 0 50% 50%/0 0 100% 100%;
    background:var(--glass-hi);
    opacity:0.5;
  }

  .droplet{
    position:absolute;
    width:5px; height:5px;
    border-radius:50%;
    background:rgba(237,231,218,0.35);
  }

  /* ---------- ground ---------- */
  .ground{
    position:absolute;
    bottom:0; left:0; right:0;
    height:56px;
    background:linear-gradient(180deg, rgba(90,70,50,0.35), rgba(40,30,22,0.55));
    border-top:1px solid rgba(237,231,218,0.06);
  }

  /* ---------- character ---------- */
  .character{
    position:absolute;
    left:50%; bottom:52px;
    transform:translateX(-50%);
    width:150px; height:190px;
  }

  .stem{
    position:absolute;
    left:50%; bottom:0;
    width:10px; height:64px;
    transform:translateX(-50%);
    background:linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #0a0f0c));
    border-radius:6px;
    transition:background 600ms ease;
    animation:sway 3.6s ease-in-out infinite;
    transform-origin:bottom center;
  }

  .leaf{
    position:absolute;
    width:58px; height:34px;
    background:var(--accent);
    border-radius:70% 20% 70% 20%;
    transition:background 600ms ease, transform 500ms cubic-bezier(.34,1.4,.64,1), opacity 500ms ease;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .leaf-l{ bottom:52px; left:8px; transform:rotate(-18deg); transform-origin:100% 60%;}
  .leaf-r{ bottom:52px; right:8px; transform:rotate(18deg) scaleX(-1); transform-origin:0% 60%;}

  .head{
    position:absolute;
    left:50%; bottom:96px;
    width:78px; height:78px;
    transform:translateX(-50%);
    background:radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--accent) 70%, white), var(--accent));
    border-radius:52% 52% 50% 50%/58% 58% 46% 46%;
    transition:background 600ms ease, transform 500ms ease;
    animation:breathe 3.6s ease-in-out infinite;
    box-shadow:0 8px 24px -8px color-mix(in srgb, var(--accent) 70%, transparent);
  }

  .face{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; gap:16px;
  }
  .eye{
    width:7px; height:9px;
    background:rgba(10,15,12,0.75);
    border-radius:50%;
    transition:all 400ms ease;
  }

  .sprout-tip{
    position:absolute;
    left:50%; top:-10px;
    width:14px; height:22px;
    transform:translateX(-50%);
    background:var(--accent);
    border-radius:60% 60% 50% 50%/80% 80% 20% 20%;
    transition:background 600ms ease;
  }

  @keyframes breathe{
    0%,100%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.045);}
  }
  @keyframes sway{
    0%,100%{transform:translateX(-50%) rotate(-2deg);}
    50%{transform:translateX(-50%) rotate(2deg);}
  }

  /* state: greeting — leaves wave, eyes wide */
  .jar.is-greeting .leaf-l{ animation:wave-l 650ms ease-in-out infinite; }
  .jar.is-greeting .leaf-r{ animation:wave-r 650ms ease-in-out infinite; }
  @keyframes wave-l{ 0%,100%{transform:rotate(-18deg);} 50%{transform:rotate(-38deg);} }
  @keyframes wave-r{ 0%,100%{transform:rotate(18deg) scaleX(-1);} 50%{transform:rotate(38deg) scaleX(-1);} }
  .jar.is-greeting .eye{ height:11px; }

  /* state: focused — leaves lean in, eyes narrow */
  .jar.is-focused .leaf-l{ transform:rotate(-30deg) translateX(6px); }
  .jar.is-focused .leaf-r{ transform:rotate(30deg) scaleX(-1) translateX(-6px); }
  .jar.is-focused .eye{ height:5px; border-radius:2px; }
  .jar.is-focused .head{ animation-duration:2.2s; }

  /* state: celebrating — bounce + sparkles */
  .jar.is-celebrating .head{ animation:bounce 620ms ease-in-out infinite; }
  .jar.is-celebrating .leaf-l{ animation:wave-l 420ms ease-in-out infinite; }
  .jar.is-celebrating .leaf-r{ animation:wave-r 420ms ease-in-out infinite; }
  .jar.is-celebrating .eye{ height:9px; border-radius:50% 50% 0 0; transform:translateY(1px);}
  @keyframes bounce{
    0%,100%{transform:translateX(-50%) translateY(0) scale(1);}
    50%{transform:translateX(-50%) translateY(-10px) scale(1.05);}
  }
  .sparkle{
    position:absolute;
    width:6px; height:6px;
    background:#ffd88a;
    border-radius:50%;
    opacity:0;
    box-shadow:0 0 8px 1px #ffd88a;
  }
  .jar.is-celebrating .sparkle{ animation:pop 1100ms ease-out infinite; }
  .sp1{ top:30%; left:22%; animation-delay:0ms !important; }
  .sp2{ top:24%; right:24%; animation-delay:250ms !important; }
  .sp3{ top:44%; right:16%; animation-delay:500ms !important; }
  .sp4{ top:50%; left:16%; animation-delay:750ms !important; }
  @keyframes pop{
    0%{ opacity:0; transform:translateY(0) scale(0.4);}
    30%{ opacity:1; transform:translateY(-14px) scale(1);}
    100%{ opacity:0; transform:translateY(-30px) scale(0.6);}
  }

  /* state: sleepy — eyes closed, droop, slow breathing */
  .jar.is-sleepy .eye{ height:2px; border-radius:2px; }
  .jar.is-sleepy .leaf-l{ transform:rotate(-6deg) translateY(10px); }
  .jar.is-sleepy .leaf-r{ transform:rotate(6deg) scaleX(-1) translateY(10px); }
  .jar.is-sleepy .head{ animation-duration:6s; }
  .jar.is-sleepy .stem{ animation-duration:6s; }
  .zzz{
    position:absolute;
    top:6%; right:18%;
    font-family:'Fraunces', serif;
    font-size:15px;
    color:var(--cream-dim);
    opacity:0;
  }
  .jar.is-sleepy .zzz{ animation:zzz-float 3.2s ease-in infinite; }
  @keyframes zzz-float{
    0%{opacity:0; transform:translateY(0) scale(0.7);}
    20%{opacity:0.8;}
    80%{opacity:0;}
    100%{opacity:0; transform:translateY(-26px) scale(1.1);}
  }

  /* state: thinking — pulsing dots above head */
  .thinking-dots{
    position:absolute;
    top:2%; left:50%;
    transform:translateX(-50%);
    display:flex; gap:5px;
    opacity:0;
  }
  .jar.is-thinking .thinking-dots{ opacity:1; }
  .thinking-dots span{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--accent);
    animation:dot-pulse 1.1s ease-in-out infinite;
  }
  .thinking-dots span:nth-child(2){ animation-delay:0.15s; }
  .thinking-dots span:nth-child(3){ animation-delay:0.3s; }
  @keyframes dot-pulse{
    0%,60%,100%{ transform:translateY(0); opacity:0.4; }
    30%{ transform:translateY(-5px); opacity:1; }
  }

  /* state: offline — dim, fogged */
  .fog{
    position:absolute; inset:0;
    background:rgba(20,26,22,0);
    transition:background 600ms ease;
    pointer-events:none;
  }
  .jar.is-offline .fog{ background:rgba(20,26,22,0.42); }

  /* ---------- readout ---------- */
  .readout{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size:13px;
  }
  .readout .state-name{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:19px;
    color:var(--cream);
    letter-spacing:0.01em;
  }
  .readout .dash{ color:var(--cream-faint); }
  .readout .time{ color:var(--cream-dim); }

  /* ---------- controls ---------- */
  .controls{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
  }
  .controls button{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    letter-spacing:0.02em;
    color:var(--cream-dim);
    background:rgba(237,231,218,0.04);
    border:1px solid rgba(237,231,218,0.10);
    border-radius:8px;
    padding:9px 4px;
    cursor:pointer;
    transition:all 180ms ease;
  }
  .controls button:hover{
    background:rgba(237,231,218,0.09);
    color:var(--cream);
  }
  .controls button.active{
    background:color-mix(in srgb, var(--accent) 22%, transparent);
    border-color:color-mix(in srgb, var(--accent) 55%, transparent);
    color:var(--cream);
  }

  /* ---------- brief panel (greeting only) ---------- */
  .brief{
    width:100%;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height 500ms ease, opacity 400ms ease, padding 500ms ease, margin 500ms ease;
    background:rgba(237,231,218,0.04);
    border:1px solid rgba(237,231,218,0.08);
    border-radius:10px;
    font-size:12px;
    line-height:1.6;
    color:var(--cream-dim);
  }
  .brief.show{
    max-height:120px;
    opacity:1;
    padding:14px 16px;
  }
  .brief b{ color:var(--cream); font-weight:500; }

  .caption{
    font-size:10px;
    color:var(--cream-faint);
    text-align:center;
    line-height:1.6;
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="eyebrow"><b>Module A</b> — shell &amp; avatar · debug preview</div>

    <div class="jar-wrap">
      <div class="halo" id="halo"></div>
      <div class="jar" id="jar">
        <div class="fog"></div>
        <div class="jar-rim"></div>
        <div class="droplet" style="top:22%; left:16%;"></div>
        <div class="droplet" style="top:40%; right:20%;"></div>
        <div class="droplet" style="top:64%; left:24%; width:3px; height:3px;"></div>

        <div class="thinking-dots"><span></span><span></span><span></span></div>
        <div class="zzz">z z z</div>

        <div class="character">
          <div class="sparkle sp1"></div>
          <div class="sparkle sp2"></div>
          <div class="sparkle sp3"></div>
          <div class="sparkle sp4"></div>
          <div class="stem"></div>
          <div class="leaf leaf-l"></div>
          <div class="leaf leaf-r"></div>
          <div class="head">
            <div class="sprout-tip"></div>
            <div class="face">
              <div class="eye"></div>
              <div class="eye"></div>
            </div>
          </div>
        </div>

        <div class="ground"></div>
      </div>
    </div>

    <div class="readout">
      <span class="state-name" id="stateName">Idle</span>
      <span class="dash">·</span>
      <span class="time" id="timeNow">09:41</span>
    </div>

    <div class="controls" id="controls"></div>

    <div class="brief" id="brief">
      Good morning. <b>3 tasks</b> today, first one's due at 11:00. Light rain moves in this afternoon — 62°F now.
    </div>

    <div class="caption">Manual triggers stand in for real signals (idle timer, task events,<br>calendar proximity) until Module B's state engine is wired in.</div>
  </div>

<script>
  // State table as data — matches the SRS §3 requirement: transitions
  // and per-state metadata live in config, not scattered if/else logic.
  const STATES = {
    idle:        { label: "Idle",        color: "var(--c-idle)" },
    greeting:    { label: "Greeting",    color: "var(--c-greeting)" },
    focused:     { label: "Focused",     color: "var(--c-focused)" },
    celebrating: { label: "Celebrating", color: "var(--c-celebrating)" },
    sleepy:      { label: "Sleepy",      color: "var(--c-sleepy)" },
    thinking:    { label: "Thinking",    color: "var(--c-thinking)" },
    offline:     { label: "Offline",     color: "var(--c-offline)" },
  };

  const jar = document.getElementById('jar');
  const halo = document.getElementById('halo');
  const stateNameEl = document.getElementById('stateName');
  const brief = document.getElementById('brief');
  const controls = document.getElementById('controls');

  let current = 'idle';

  function renderButtons(){
    controls.innerHTML = '';
    Object.keys(STATES).forEach(key => {
      const btn = document.createElement('button');
      btn.textContent = STATES[key].label;
      btn.dataset.state = key;
      if (key === current) btn.classList.add('active');
      btn.addEventListener('click', () => setState(key));
      controls.appendChild(btn);
    });
  }

  function setState(key){
    if (!STATES[key]) return;
    current = key;

    // swap the is-* class on the jar
    Object.keys(STATES).forEach(k => jar.classList.remove('is-' + k));
    jar.classList.add('is-' + key);

    // update accent color driving glow, leaves, stem, head
    document.documentElement.style.setProperty('--accent', STATES[key].color);

    stateNameEl.textContent = STATES[key].label;
    brief.classList.toggle('show', key === 'greeting');

    renderButtons();
  }

  function tick(){
    const now = new Date();
    const hh = String(now.getHours()).padStart(2,'0');
    const mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('timeNow').textContent = hh + ':' + mm;
  }
  tick();
  setInterval(tick, 15000);

  setState('idle');
</script>
</body>
</html>
